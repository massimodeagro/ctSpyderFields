[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ctSpyderFields"
version = "1.0"
dependencies = [
    "numpy>=1.24,<2",  # not compatible with numpy 2
    "opencv-python>=4.8",
    "trimesh>=4.0",
    "pandas>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "plotly>=5.17",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "alphashape>=1.3.1",
    "shapely>=2.0",
    "tifffile>=2023.7.10",
]
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Massimo De Agro'", email = "massimo.deagro@unitn.it"},
  {name = "Daniele Caradonna"},
  {name = "Atal Pande"},
  {name = "Egidio Falotico"},
  {name = "Lauren Sumner-Rooney"},

]
readme = "README.md"
